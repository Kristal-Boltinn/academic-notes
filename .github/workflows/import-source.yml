name: Import reviewed source
on:
  push:
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare Electron sandbox
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run --auto-servernum npm run test:electron
      - run: npm run check:release
      - name: Verify reproducible build
        run: |
          sha256sum main.js styles.css > /tmp/academic-build.sha256
          npm run build
          sha256sum --check /tmp/academic-build.sha256
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create 2.2.1 main.js manifest.json styles.css --draft --target "$(git rev-parse HEAD)" --title 'Academic Notes 2.2.1' --notes 'Theorem, equation, figure and table numbering, cross-file references, and local Electron PDF export. Install the three attached plugin files. See README for syntax and usage.'
